name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  program:
    name: Program (build + LiteSVM tests) and backend integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the toolchain that built the devnet deployment. "stable" moved to 4.3,
      # whose binaries litesvm 0.10 refuses to load (add_program: InvalidAccountData).
      - name: Install Solana CLI (platform tools for cargo build-sbf)
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v4.2.2/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            insure/target
          key: cargo-solana-4.2.2-${{ hashFiles('insure/Cargo.lock') }}

      - name: Build program
        working-directory: insure
        run: cargo build-sbf --manifest-path programs/insure/Cargo.toml

      - name: Program tests (exploit regressions, account sizes)
        working-directory: insure
        run: cargo test

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Backend tests against the compiled program
        working-directory: backend
        run: |
          npm ci
          npm test

  backend:
    name: Backend (typecheck + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - working-directory: backend
        run: |
          npm ci
          npm run typecheck
          npm test

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: |
          npm ci
          npx eslint src
          npx tsc --noEmit
          npm run build
